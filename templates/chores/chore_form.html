<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ form_title }} | Assign Chores</title>
  </head>
  <body>
    <main>
      <p>
        <a href="{% url 'household_detail' household.id %}">
          Back to {{ household.name }}
        </a>
      </p>
      <h1>{{ form_title }}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ submit_label }}</button>
      </form>
    </main>
  </body>
</html>
